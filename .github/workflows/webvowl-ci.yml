name: WebVOWL application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tooling:
    name: Python tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install Python tooling requirements
        run: node util/runRepositoryPython.mjs -m pip install -r requirements-dev.txt
      - run: npm run test:setup

  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webvowl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: webvowl
          persist-credentials: false
      - name: Check out immutable ontology corpus inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/universal-ontology
          ref: b3984ffbfe9b38cca7bd4570aeb3f5bc0fa6f20e
          path: universal-ontology
          persist-credentials: false
          sparse-checkout: |
            src/external
            src/iso
            src/iso-iec
            src/universal
      - name: Stage static corpus bytes in the existing test layout
        working-directory: universal-ontology
        run: |
          mkdir -p dist
          cp -a src/external src/iso src/iso-iec src/universal dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: webvowl/.node-version
          package-manager-cache: false
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: npm run build

  required:
    name: WebVOWL application
    if: always()
    needs: [application, tooling]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful application checks
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
        run: |
          test "$APPLICATION_RESULT" = success
          test "$TOOLING_RESULT" = success
