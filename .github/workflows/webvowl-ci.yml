name: WebVOWL application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: scope
        run: node util/selectCiChecks.mjs

  tooling:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    name: Python tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          npm ci --ignore-scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install Python tooling requirements
        run: |
          node util/runRepositoryPython.mjs -m pip install --require-hashes --only-binary=:all: -r requirements.lock.txt
      - run: npm run check:python

  documentation:
    needs: scope
    name: Markdown checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install only locked documentation tools
        shell: bash
        run: |
          set -euo pipefail
          node util/prepareDocumentationTools.mjs --output "$RUNNER_TEMP/documentation-tools"
          npm ci --prefix "$RUNNER_TEMP/documentation-tools" --ignore-scripts --no-audit --no-fund
          mkdir node_modules
          cp -R "$RUNNER_TEMP/documentation-tools/node_modules/prettier" node_modules/prettier
          python -m venv .venv
          node util/runRepositoryPython.mjs -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/documentation-tools/requirements.txt"
      - name: Check selected authored documents
        run: node util/checkDocumentation.mjs

  application:
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webvowl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: webvowl
          persist-credentials: false
      - name: Check out immutable ontology corpus inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/universal-ontology
          ref: b3984ffbfe9b38cca7bd4570aeb3f5bc0fa6f20e
          path: universal-ontology
          persist-credentials: false
          sparse-checkout: |
            src/external
            src/iso
            src/iso-iec
            src/universal
      - name: Stage static corpus bytes in the existing test layout
        working-directory: universal-ontology
        run: |
          mkdir -p dist
          cp -a src/external src/iso src/iso-iec src/universal dist/
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: webvowl/.node-version
          package-manager-cache: false
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: npm run build

  required:
    name: WebVOWL application
    if: always()
    needs: [scope, application, tooling, documentation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful application checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          FULL_CHECKS: ${{ needs.scope.outputs.full }}
          APPLICATION_RESULT: ${{ needs.application.result }}
          TOOLING_RESULT: ${{ needs.tooling.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$DOCUMENTATION_RESULT" = success
          case "$FULL_CHECKS" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          test "$APPLICATION_RESULT" = "$expected"
          test "$TOOLING_RESULT" = "$expected"
