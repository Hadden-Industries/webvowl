name: WebVOWL application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Select application checks
    runs-on: ubuntu-24.04
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Compare application inputs before installing dependencies
        id: scope
        run: node util/selectPullRequestChecks.mjs --scope application

  application:
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: npm run build

  required:
    name: WebVOWL application
    if: always()
    needs: [scope, application]
    runs-on: ubuntu-24.04
    steps:
      - name: Require success for selected application checks
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: ${{ needs.scope.outputs.application }}
          APPLICATION_RESULT: ${{ needs.application.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$SELECTED" = true ]; then test "$APPLICATION_RESULT" = success; fi
