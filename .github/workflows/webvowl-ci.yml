name: WebVOWL application checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reuse: ${{ steps.verify.outputs.reuse }}
      source_run_id: ${{ steps.verify.outputs.source_run_id }}
      source_run_attempt: ${{ steps.verify.outputs.source_run_attempt }}
      source_commit: ${{ steps.verify.outputs.source_commit }}
      source_receipt_id: ${{ steps.verify.outputs.source_receipt_id }}
      source_receipt_digest: ${{ steps.verify.outputs.source_receipt_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: scope
        run: node util/selectCiChecks.mjs
      - name: Select a same-repository PR receipt
        id: select
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node util/ciEvidenceCommand.mjs select
      - name: Download the exact immutable PR receipt
        id: proof
        if: steps.select.outputs.available == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          run-id: ${{ steps.select.outputs.run_id }}
          repository: Hadden-Industries/webvowl
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/webvowl-ci/download
          merge-multiple: false
          skip-decompress: false
          digest-mismatch: error
      - name: Verify PR evidence or select ordinary execution
        id: verify
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL_CHECKS: ${{ steps.scope.outputs.full }}
          PROOF_DOWNLOAD_OUTCOME: ${{ steps.proof.outcome }}
        run: node util/ciEvidenceCommand.mjs verify

  tooling:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.reuse != 'true'
    name: Python tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          npm ci --ignore-scripts
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install Python tooling requirements
        run: |
          node util/runRepositoryPython.mjs -m pip install --require-hashes --only-binary=:all: --no-binary=PyYAML -r requirements.lock.txt
      - run: npm run check:python

  documentation:
    needs: scope
    if: needs.scope.outputs.reuse != 'true'
    name: Markdown checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Acquire the exact isolated Markdown graph
        run: npm ci --prefix tooling/markdown --ignore-scripts --no-audit --no-fund
      - name: Select package manager before root documentation commands
        run: npm install --global --no-audit --no-fund npm@12.2.0
      - name: Check the full authored corpus
        run: npm run check:docs && npm run test:markdown

  application:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webvowl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: webvowl
          persist-credentials: false
      - name: Check out immutable ontology corpus inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Hadden-Industries/universal-ontology
          ref: b3984ffbfe9b38cca7bd4570aeb3f5bc0fa6f20e
          path: universal-ontology
          persist-credentials: false
          sparse-checkout: |
            src/external
            src/iso
            src/iso-iec
            src/universal
      - name: Stage static corpus bytes in the existing test layout
        working-directory: universal-ontology
        run: |
          mkdir -p dist
          cp -a src/external src/iso src/iso-iec src/universal dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: webvowl/.node-version
          package-manager-cache: false
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.2.0
          npm ci --ignore-scripts
      - run: npm test -- --runInBand
      - run: npm run build

  required:
    name: WebVOWL application
    if: always()
    needs: [scope, application, tooling, documentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Require executed checks or verified PR evidence
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node util/ciEvidenceCommand.mjs gate
      - name: Record successful executed PR evidence
        id: receipt
        if: github.event_name == 'pull_request'
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node util/ciEvidenceCommand.mjs record
      - name: Retain the immutable PR receipt
        if: steps.receipt.outputs.recorded == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webvowl-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.receipt.outputs.path }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
          overwrite: false
          archive: true
