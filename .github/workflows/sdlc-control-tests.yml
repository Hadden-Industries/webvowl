name: SDLC control tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scope:
    name: Select relevant checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sdlc: ${{ steps.scope.outputs.sdlc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Compare PR inputs before installing dependencies
        id: scope
        run: node util/selectPullRequestChecks.mjs --scope sdlc

  controls:
    needs: scope
    if: needs.scope.outputs.sdlc == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Select package manager and install locked dependencies
        run: |
          npm install --global --no-audit --no-fund npm@12.0.2
          npm ci --ignore-scripts
      - name: Create isolated Python environment
        run: python -m venv .venv
      - name: Install SDLC dependencies through repository interpreter
        run: node util/runRepositoryPython.mjs -m pip install -r requirements-sdlc.txt
      - run: npm run test:sdlc
      - run: npm run test:setup
      - run: npm run test:controls
      - name: Activate and verify repository-local configuration
        run: |
          npm run setup:sdlc
          npm run check:sdlc

  required:
    name: SDLC controls
    if: always()
    needs: [scope, controls]
    runs-on: ubuntu-24.04
    steps:
      - name: Require success for selected controls
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          SELECTED: ${{ needs.scope.outputs.sdlc }}
          CONTROL_RESULT: ${{ needs.controls.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$SELECTED" = true ]; then test "$CONTROL_RESULT" = success; fi
# Setup/control fixtures are isolated; no live model calls or product deployment.
